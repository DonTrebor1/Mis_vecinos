  </button>

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5"/><path d="M5.5 9.5V20a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1V9.5"/><path d="M9.5 21v-6h5v6"/></svg>
      <span class="brand-name">Mis Vecinos</span>
    </div>
    <nav class="nav" id="navList">
      <a class="nav-item" href="index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5"/><path d="M5.5 9.5V20a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1V9.5"/><path d="M9.5 21v-6h5v6"/></svg>
        <span data-i18n="navHome">Inicio</span>
      </a>
      <a class="nav-item" href="panel.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V10M10 19V5M16 19v-7M4 19h16"/></svg>
        <span data-i18n="navPanel">Panel de la comunidad</span>
      </a>
      <a class="nav-item" href="incidencias.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 1-5.4 5.4L4 17l3 3 5.3-5.3a4 4 0 0 1 5.4-5.4l-2.8 2.8-2-2z"/></svg>
        <span data-i18n="navIncidents">Incidencias</span><span class="nav-badge" id="navIncidentsBadge" hidden></span>
      </a>
      <a class="nav-item active" href="comunidad.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11v2a1 1 0 0 0 1 1h2l5 4V6L6 10H4a1 1 0 0 0-1 1z"/><path d="M16 8.5a4 4 0 0 1 0 7M19 6a7.5 7.5 0 0 1 0 12"/></svg>
        <span data-i18n="navCommunity">Comunidad</span>
      </a>
      <a class="nav-item" href="documentos.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4M9.5 12h5M9.5 15.5h5M9.5 8.5h2"/></svg>
        <span data-i18n="navDocuments">Documentos</span>
      </a>
      <a class="nav-item" href="configuracion.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 13.5a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V19.6a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H4.4a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.56-1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H10.5a1.7 1.7 0 0 0 1-1.55V4.4a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V10.5a1.7 1.7 0 0 0 1.55 1H19.6a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.56 1z"/></svg>
        <span data-i18n="navSettings">Configuración</span>

    <div class="sidebar-unit" id="sidebarUnit"></div>
    <div class="sidebar-footer">
      <button class="theme-quick" id="installAppBtn" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 19h14"/></svg>
        <span data-i18n="installApp">Instalar app</span>
      </button>
      <button class="theme-quick" id="quickTheme">
        <svg id="quickThemeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
        <span id="quickThemeLabel" data-i18n="darkMode">Modo oscuro</span>
      </button>
    </div>
  </aside>

  <main class="content">
<div class="view-head">
        <p class="eyebrow" data-i18n="commEyebrow">Vida en comunidad</p>
        <h1 data-i18n="commTitle">Comunidad</h1>
        <p data-i18n="commSubtitle">Avisos del administrador y votaciones rápidas entre vecinos.</p>
      </div>

      <div class="tabs">
        <button class="tab-btn active" data-ctab="notices" data-i18n="tabNotices">Avisos</button>
        <button class="tab-btn" data-ctab="polls" data-i18n="tabPolls">Votaciones</button>
      </div>

      <div id="noticesPanel">
        <button class="btn btn-outline create-toggle" id="toggleNoticeForm">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          <span data-i18n="newNoticeBtn">Nuevo aviso</span>
        </button>
        <form id="noticeForm" class="card pad create-form" hidden>
          <div class="form-group">
            <label for="noticeTitle" data-i18n="noticeTitleLabel">Título</label>
            <input type="text" id="noticeTitle" data-i18n-placeholder="noticeTitlePlaceholder" placeholder="p. ej. Corte de agua el jueves" required>
          </div>
          <div class="form-group">
            <label for="noticeBody" data-i18n="noticeBodyLabel">Mensaje</label>
            <textarea id="noticeBody" data-i18n-placeholder="noticeBodyPlaceholder" placeholder="Detalles del aviso..." required></textarea>
          </div>
          <div class="form-group">
            <label for="noticeUnit" data-i18n="unitLabel">Tu vivienda (opcional)</label>
            <input type="text" id="noticeUnit" data-i18n-placeholder="unitPlaceholder" placeholder="p. ej. 3ºB">
          </div>
          <button type="submit" class="btn btn-primary" data-i18n="noticeSubmit">Publicar aviso</button>
        </form>
        <div id="noticesList"></div>
      </div>

      <div id="pollsPanel" hidden>
        <button class="btn btn-outline create-toggle" id="togglePollForm">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          <span data-i18n="newPollBtn">Nueva votación</span>
        </button>
        <form id="pollForm" class="card pad create-form" hidden>
          <div class="form-group">
            <label for="pollQuestion" data-i18n="pollQuestionLabel">Pregunta</label>
            <input type="text" id="pollQuestion" data-i18n-placeholder="pollQuestionPlaceholder" placeholder="p. ej. ¿Cambiamos el portero automático?" required>
          </div>
          <div class="form-group"><label data-i18n="pollOptionLabel">Opción 1</label><input type="text" id="pollOpt1" required></div>
          <div class="form-group"><label data-i18n="pollOptionLabel">Opción 2</label><input type="text" id="pollOpt2" required></div>
          <div class="form-group"><label id="pollOpt3Label"></label><input type="text" id="pollOpt3"></div>
          <div class="form-group"><label id="pollOpt4Label"></label><input type="text" id="pollOpt4"></div>
          <button type="submit" class="btn btn-primary" data-i18n="pollSubmit">Publicar votación</button>
        </form>
        <div id="pollsList"></div>
      </div>
  </main>
</div>

<div class="toast" id="toast">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
  <span id="toastText"></span>
</div>

<script src="script.js"></script>
</body>
</html>
