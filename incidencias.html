<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis Vecinos — Incidencias</title>
<meta name="description" content="Reporta y sigue el estado de las incidencias del edificio.">
<meta name="theme-color" content="#1e2732">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta property="og:title" content="Mis Vecinos — Incidencias">
<meta property="og:description" content="Reporta y sigue el estado de las incidencias del edificio.">
<meta property="og:type" content="website">
<meta property="og:image" content="icons/icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app-shell">
  <button class="menu-toggle" id="menuToggle" aria-label="Abrir menú" aria-expanded="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
  </button>
  <div class="backdrop" id="backdrop"></div>

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5"/><path d="M5.5 9.5V20a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1V9.5"/><path d="M9.5 21v-6h5v6"/></svg>
      <span class="brand-name">Mis Vecinos</span>
    </div>
    <nav class="nav" id="navList">
      <a class="nav-item" href="index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5"/><path d="M5.5 9.5V20a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1V9.5"/><path d="M9.5 21v-6h5v6"/></svg>
        <span data-i18n="navHome">Inicio</span>
      </a>
      <a class="nav-item" href="panel.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V10M10 19V5M16 19v-7M4 19h16"/></svg>
        <span data-i18n="navPanel">Panel de la comunidad</span>
      </a>
      <a class="nav-item active" href="incidencias.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 1-5.4 5.4L4 17l3 3 5.3-5.3a4 4 0 0 1 5.4-5.4l-2.8 2.8-2-2z"/></svg>
        <span data-i18n="navIncidents">Incidencias</span><span class="nav-badge" id="navIncidentsBadge" hidden></span>
      </a>
      <a class="nav-item" href="comunidad.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11v2a1 1 0 0 0 1 1h2l5 4V6L6 10H4a1 1 0 0 0-1 1z"/><path d="M16 8.5a4 4 0 0 1 0 7M19 6a7.5 7.5 0 0 1 0 12"/></svg>
        <span data-i18n="navCommunity">Comunidad</span>
      </a>
      <a class="nav-item" href="documentos.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4M9.5 12h5M9.5 15.5h5M9.5 8.5h2"/></svg>
        <span data-i18n="navDocuments">Documentos</span>
      </a>
      <a class="nav-item" href="telefonos.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.6 4.5h3.2l1.4 3.8-2 1.6a12.5 12.5 0 0 0 5.9 5.9l1.6-2 3.8 1.4v3.2a1.6 1.6 0 0 1-1.7 1.6C10.9 19.6 4.4 13.1 4 5.2a1.6 1.6 0 0 1 1.6-1.7Z"/></svg>
        <span data-i18n="navPhones">Teléfonos de interés</span>
      </a>
      <a class="nav-item" href="configuracion.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5.20"/><circle cx="12" cy="12" r="1.5"/><rect x="10.85" y="3.80" width="2.30" height="2.40" rx="0.5" transform="rotate(0 12 12)"/><rect x="10.85" y="3.80" width="2.30" height="2.40" rx="0.5" transform="rotate(45 12 12)"/><rect x="10.85" y="3.80" width="2.30" height="2.40" rx="0.5" transform="rotate(90 12 12)"/><rect x="10.85" y="3.80" width="2.30" height="2.40" rx="0.5" transform="rotate(135 12 12)"/><rect x="10.85" y="3.80" width="2.30" height="2.40" rx="0.5" transform="rotate(180 12 12)"/><rect x="10.85" y="3.80" width="2.30" height="2.40" rx="0.5" transform="rotate(225 12 12)"/><rect x="10.85" y="3.80" width="2.30" height="2.40" rx="0.5" transform="rotate(270 12 12)"/><rect x="10.85" y="3.80" width="2.30" height="2.40" rx="0.5" transform="rotate(315 12 12)"/></svg>
        <span data-i18n="navSettings">Configuración</span>
      </a>
    </nav>
    <div class="sidebar-unit" id="sidebarUnit"></div>
    <div class="sidebar-footer">
      <button class="theme-quick" id="installAppBtn" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 19h14"/></svg>
        <span data-i18n="installApp">Instalar app</span>
      </button>
      <button class="theme-quick" id="quickTheme">
        <svg id="quickThemeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
        <span id="quickThemeLabel" data-i18n="darkMode">Modo oscuro</span>
      </button>
    </div>
  </aside>

  <main class="content">
<div class="view-head">
        <p class="eyebrow" data-i18n="incEyebrow">Mantenimiento</p>
        <h1 data-i18n="reportIncident">Incidencias</h1>
        <p data-i18n="incInstructions">Describe el problema, adjunta fotos si puedes, y el administrador lo verá aquí mismo.</p>
      </div>

      <div class="incidents-grid">
        <div class="card pad">
          <h3 style="margin-bottom:14px;font-size:1rem;" data-i18n="newIncidentTitle">Nueva incidencia</h3>
          <form id="complaintForm">
            <div class="form-group">
              <label for="description" data-i18n="descriptionLabel">Descripción</label>
              <textarea id="description" data-i18n-placeholder="placeholderDescription" placeholder="Describe tu problema..." required></textarea>
            </div>
            <div class="field-row">
              <div class="form-group">
                <label for="incCategory" data-i18n="categoryLabel">Categoría</label>
                <select id="incCategory">
                  <option value="plumbing" data-i18n="catPlumbing">Fontanería</option>
                  <option value="electric" data-i18n="catElectric">Electricidad</option>
                  <option value="elevator" data-i18n="catElevator">Ascensor</option>
                  <option value="cleaning" data-i18n="catCleaning">Limpieza</option>
                  <option value="common" data-i18n="catCommon">Zonas comunes</option>
                  <option value="other" selected data-i18n="catOther">Otros</option>
                </select>
              </div>
              <div class="form-group">
                <label for="incPriority" data-i18n="priorityLabel">Prioridad</label>
                <select id="incPriority">
                  <option value="low" selected data-i18n="prioLow">Baja</option>
                  <option value="medium" data-i18n="prioMedium">Media</option>
                  <option value="urgent" data-i18n="prioUrgent">Urgente</option>
                </select>
              </div>
            </div>
            <div class="form-group">
              <label for="incUnit" data-i18n="unitLabel">Tu vivienda (opcional)</label>
              <input type="text" id="incUnit" data-i18n-placeholder="unitPlaceholder" placeholder="p. ej. 3ºB">
            </div>
            <div class="form-group">
              <label data-i18n="attachImage">Fotos (opcional)</label>
              <label class="file-drop" id="fileDrop">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M12 4l-4 4M12 4l4 4"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
                <span id="fileLabel" data-i18n="noFileSelected">Ningún archivo seleccionado</span>
                <input type="file" id="imageUpload" accept="image/*" multiple>
              </label>
            </div>
            <button type="submit" class="btn btn-primary btn-block" data-i18n="submitIncident">Enviar incidencia</button>
          </form>
        </div>

        <div id="incidentsListSection">
          <div class="tabs">
            <button class="tab-btn active" data-tab="open" data-i18n="tabOpen">Abiertas</button>
            <button class="tab-btn" data-tab="resolved" data-i18n="tabResolved">Resueltas</button>
          </div>
          <div class="filters-bar">
            <input type="text" id="filterQ" data-i18n-placeholder="searchPlaceholder" placeholder="Buscar incidencias...">
            <select id="filterCategory"><option value="all" data-i18n="filterCategoryAll">Todas las categorías</option>
              <option value="plumbing" data-i18n="catPlumbing">Fontanería</option>
              <option value="electric" data-i18n="catElectric">Electricidad</option>
              <option value="elevator" data-i18n="catElevator">Ascensor</option>
              <option value="cleaning" data-i18n="catCleaning">Limpieza</option>
              <option value="common" data-i18n="catCommon">Zonas comunes</option>
              <option value="other" data-i18n="catOther">Otros</option>
            </select>
            <select id="filterPriority"><option value="all" data-i18n="filterPriorityAll">Todas las prioridades</option>
              <option value="low" data-i18n="prioLow">Baja</option>
              <option value="medium" data-i18n="prioMedium">Media</option>
              <option value="urgent" data-i18n="prioUrgent">Urgente</option>
            </select>
          </div>
          <div id="incidentsList"></div>
          <div id="resolvedList" hidden></div>
        </div>
      </div>
  </main>
</div>

<div class="toast" id="toast">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
  <span id="toastText"></span>
</div>

<script src="script.js"></script>
</body>
</html>
